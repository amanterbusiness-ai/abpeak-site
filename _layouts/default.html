<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
:root { --bg: #ffffff; --fg: #111312; --muted: #5c625f; --line: #e3e6e4; --accent: #3f5f00; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0d0c; --fg: #f2f4f3; --muted: #a3aaa6; --line: #262b28; --accent: #d4ff3a; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
header a.brand { font-weight: 700; font-size: 20px; color: var(--fg); text-decoration: none; }
nav a { color: var(--muted); margin-left: 12px; font-size: 15px; }
a { color: var(--accent); text-underline-offset: 3px; }
h1 { font-size: 30px; line-height: 1.2; } h2 { font-size: 21px; margin-top: 32px; }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
footer a { color: var(--muted); margin-right: 12px; }
</style>
</head>
<body><main>
<header><a class="brand" href="/">AbPeak</a><nav><a href="/support">Support</a><a href="/datenschutz">Datenschutz</a><a href="/impressum">Impressum</a></nav></header>
{{ content }}
<footer><a href="/impressum">Impressum</a><a href="/imprint">Imprint</a><a href="/datenschutz">Datenschutz</a><a href="/privacy">Privacy</a><a href="/support">Support</a></footer>
</main></body></html>
